# ═══════════════════════════════════════════════════════════════════════════════
# NATS Server Configuration — JetStream Enabled
# ═══════════════════════════════════════════════════════════════════════════════

# Server name for cluster identification
server_name: fsocial-nats

# Client connections
listen: 0.0.0.0:4222

# HTTP monitoring endpoint
http_port: 8222

# ─── JetStream Configuration ───────────────────────────────────────────────
jetstream {
    # Persistent storage directory (mapped to Docker volume)
    store_dir: /data/jetstream

    # Maximum storage allocation
    max_mem_store:   256MB
    max_file_store:  1GB
}

# ─── Logging ────────────────────────────────────────────────────────────────
debug:   false
trace:   false
logtime: true

# ─── Connection Limits ──────────────────────────────────────────────────────
max_connections: 1024
max_payload:     8MB

# ─── Slow Consumer Handling ─────────────────────────────────────────────────
max_pending: 64MB

# ─── Graceful Shutdown ──────────────────────────────────────────────────────
lame_duck_duration:    "30s"
lame_duck_grace_period: "10s"
